[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
    \.git
  | \.pytest_cache
  | __pycache__
  | myenv
  | rtmdk_github
  | archive
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = ["myenv", "rtmdk_github", "archive"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
