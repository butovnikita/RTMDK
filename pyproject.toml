[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtmdk"
version = "8.3.3"
description = "Resonance-Topological Memory for Large Language Models"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.10"
authors = [
    {name = "RTMDK Team"},
]
keywords = ["memory", "llm", "rag", "embeddings", "vector-search", "resonance", "topology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.0",
    "fastapi>=0.100",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/butovnikita/RTMDK"
Documentation = "https://github.com/butovnikita/RTMDK/tree/master/docs"
Repository = "https://github.com/butovnikita/RTMDK.git"
Issues = "https://github.com/butovnikita/RTMDK/issues"

[project.optional-dependencies]
sot = [
    "sentence-transformers>=2.2",
    "scikit-learn>=1.3",
]
mcp = [
    "mcp>=1.27",
    "sentence-transformers>=2.2",
]
langchain = [
    "langchain-core>=0.1",
]
llamaindex = [
    "llama-index-core>=0.10",
]
server = [
    "uvicorn[standard]>=0.24",
    "httpx>=0.25",
    "msgpack>=1.0",
    "tenacity>=8.2",
    "strawberry-graphql>=0.200",
    "prometheus-client>=0.19",
    "python-dotenv>=1.0",
    "cryptography>=41.0",
    "python-multipart>=0.0.9",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
]
grpc = [
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "langchain-core>=0.1",
]

[project.scripts]
rtmdk = "rtmdk.cli:main"
rtmdk-mcp = "rtmdk.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rtmdk*"]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
    \.git
  | \.pytest_cache
  | __pycache__
  | myenv
  | rtmdk_github
  | archive
  | legacy
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = ["myenv", "rtmdk_github", "archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
