# RTMDK Production Docker Compose
# Clean deployment — No SillyTavern modules.
version: "3.8"

services:
  rtmdk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rtmdk-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - RTMDK_HOST=0.0.0.0
      - RTMDK_PORT=8080
      - RTMDK_LOG_LEVEL=INFO
      - RTMDK_MEMORY_FILE=/data/memory.json
      - LM_STUDIO_URL=${LM_STUDIO_URL:-http://host.docker.internal:12345/v1}
      - RTMDK_EMBED_MODEL=${RTMDK_EMBED_MODEL:-nomic-embed-text-v1.5}
      - RTMDK_API_KEY=${RTMDK_API_KEY:-rtmdk-local}
      - RTMDK_ENABLE_API_AUTH=${RTMDK_ENABLE_API_AUTH:-true}
      - RTMDK_ENABLE_LM_STUDIO=${RTMDK_ENABLE_LM_STUDIO:-true}
      - RTMDK_AUTO_SAVE_INTERVAL=${RTMDK_AUTO_SAVE_INTERVAL:-60}
      - REDIS_URL=redis://redis:6379/0
      # Pipeline v8.3+ settings
      - RTMDK_PIPELINE_ENABLED=true
      - RTMDK_PIPELINE_BREAKER_ENABLED=true
      - RTMDK_PIPELINE_BREAKER_FAILURE_THRESHOLD=5
      - RTMDK_PIPELINE_BREAKER_RECOVERY_TIMEOUT_MS=30000
      - RTMDK_PIPELINE_RATE_LIMIT_PER_MINUTE=60
      - RTMDK_PIPELINE_METRICS_PATH=/data/pipeline_metrics.jsonl
    volumes:
      - rtmdk-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/memory/pipeline/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    stop_grace_period: 30s
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: rtmdk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: rtmdk-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - rtmdk

  grafana:
    image: grafana/grafana:10.3.0
    container_name: rtmdk-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  rtmdk-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
