version: "3.9"

services:
  # RTMDK Memory API Server
  rtmdk-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rtmdk-memory
    ports:
      - "${RTMDK_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - RTMDK_HOST=0.0.0.0
      - RTMDK_PORT=${RTMDK_PORT:-8080}
      - RTMDK_MEMORY_FILE=/data/memory.json
      - RTMDK_API_KEY=${RTMDK_API_KEY:-rtmdk-local}
      - RTMDK_ENABLE_LM_STUDIO=${RTMDK_ENABLE_LM_STUDIO:-true}
      - LM_STUDIO_URL=${LM_STUDIO_URL:-http://host.docker.internal:12345/v1}
      - RTMDK_EMBED_MODEL=${RTMDK_EMBED_MODEL:-nomic-ai/nomic-embed-text-v1.5-GGUF}
      - RTMDK_AUTO_SAVE=${RTMDK_AUTO_SAVE:-60}
      - RTMDK_LM_STUDIO_TIMEOUT=${RTMDK_LM_STUDIO_TIMEOUT:-30}
      - RTMDK_LOG_FORMAT=${RTMDK_LOG_FORMAT:-text}
    volumes:
      - rtmdk-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - rtmdk-network

volumes:
  rtmdk-data:
    driver: local

networks:
  rtmdk-network:
    driver: bridge
