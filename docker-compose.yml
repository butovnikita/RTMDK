version: '3.8'

services:
  # RTMDK Memory Server
  rtmdk-server:
    build: .
    container_name: rtmdk-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - RTMDK_API_PROVIDER=${RTMDK_API_PROVIDER:-lm_studio}
      - LM_STUDIO_URL=${LM_STUDIO_URL:-http://host.docker.internal:12345/v1}
      - RTMDK_EMBED_MODEL=${RTMDK_EMBED_MODEL:-nomic-embed-text-v1.5}
      - RTMDK_LLM_MODEL=${RTMDK_LLM_MODEL:-default}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - RTMDK_AUTO_SAVE_INTERVAL=${RTMDK_AUTO_SAVE_INTERVAL:-60}
    volumes:
      - rtmdk-memory:/root/.rtmdk
      - ./st_config.json:/app/st_config.json:ro
      - ./.env:/app/.env:ro  # Mount env file if it exists
    networks:
      - rtmdk-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # SillyTavern Proxy
  rtmdk-proxy:
    build:
      context: .
      dockerfile: Dockerfile.home
    container_name: rtmdk-proxy
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - RTMDK_URL=http://rtmdk-server:8080
      - LM_STUDIO_URL=${LM_STUDIO_URL:-http://host.docker.internal:12345/v1}
      - PROXY_PORT=5000
    volumes:
      - ./st_config.json:/app/st_config.json:ro
    networks:
      - rtmdk-network
    depends_on:
      rtmdk-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: ["python", "rtmdk_st_proxy.py", "--rtmdk", "http://rtmdk-server:8080", "--port", "5000"]

volumes:
  rtmdk-memory:
    driver: local
  rtmdk-backups:
    driver: local

networks:
  rtmdk-network:
    driver: bridge
