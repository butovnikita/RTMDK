version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: rtmdk-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus-alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    container_name: rtmdk-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana-dashboard-pipeline.json:/var/lib/grafana/dashboards/pipeline.json
      - ./monitoring/grafana-dashboard-cost.json:/var/lib/grafana/dashboards/cost.json
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

  alertmanager:
    image: prom/alertmanager:latest
    container_name: rtmdk-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml

volumes:
  prometheus-data:
  grafana-data:
