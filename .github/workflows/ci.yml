name: RTMDK CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt -r requirements-sot.txt -r requirements-dev.txt

      - name: Run tests (fast)
        run: pytest tests/ -v --tb=short -q -m "not slow"

      - name: Run slow tests
        run: pytest tests/ -v --tb=short -q -m "slow"
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'

      - name: Coverage report
        run: pytest tests/ --cov=rtmdk --cov-report=xml --cov-fail-under=40 -m "not slow"
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'

      - name: Build package
        run: python -m build
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'

      - name: Run benchmark (smoke test)
        run: python benchmark.py --dataset datasets/qa_1000_en.json --methods bm25,word -o /tmp/benchmark_smoke.json
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
