name: RTMDK CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt -r requirements-sot.txt -r requirements-dev.txt
          pip install -e .

      - name: Lint with flake8
        run: flake8 rtmdk tests --statistics

      - name: Type check with mypy
        run: mypy rtmdk --config-file mypy.ini
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        continue-on-error: true

      - name: Format check with black
        run: black --check rtmdk tests
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'

      - name: Run tests (fast)
        shell: bash  # explicit: default on Windows is pwsh (POSIX syntax fails)
        run: |
          set +e  # runner uses bash -e; we must survive pytest's exit code
          pytest tests/ -v --tb=short -q --reruns=2 --durations=20 -m "not slow" --junitxml=pytest.xml
          status=$?
          if [ $status -ne 0 ]; then python .github/scripts/pytest_to_annotations.py pytest.xml; fi
          exit $status

      - name: Run slow tests
        run: pytest tests/ -v --tb=short -q --reruns=2 --durations=10 -m "slow"
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'

      - name: Coverage report
        run: pytest tests/ --cov=rtmdk --cov-report=xml --cov-report=term-missing --cov-fail-under=60 -m "not slow" --durations=20
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

      - name: Docker security scan
        uses: aquasecurity/trivy-action@master
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        with:
          image-ref: 'rtmdk:test'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Build package
        run: python -m build
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'

      - name: Run benchmark (smoke test)
        run: python legacy/benchmark.py --dataset datasets/qa_1000_en.json --methods bm25,word -o /tmp/benchmark_smoke.json
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'

      - name: Run pipeline-specific tests
        run: pytest tests/test_pipeline_*.py -v --tb=short
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'

      - name: Run pipeline benchmark (smoke)
        run: python scripts/bench_pipeline_ab.py --queries 10 --nodes 100
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'

      - name: Run chaos engineering tests
        run: python scripts/chaos_test_pipeline.py --mode all --seed 42
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'

      - name: Run stress test (smoke)
        run: python scripts/stress_test_pipeline.py --nodes 5000 --queries 50 --planner --cost-tracking
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'

  pipeline-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt -r requirements-sot.txt -r requirements-dev.txt
          pip install -e .

      - name: Run all pipeline tests
        run: pytest tests/test_pipeline_*.py -v --tb=short

      - name: Verify pipeline module imports
        run: python -c "from rtmdk.pipeline import PipelineExecutor, PipelineStage, CircuitBreaker, StreamingPipelineExecutor; print('OK')"

  performance-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt -r requirements-sot.txt -r requirements-dev.txt
          pip install -e .

      - name: Run planner A/B benchmark
        run: python scripts/bench_planner_savings.py --dataset datasets/comprehensive_500.json --n 200

      - name: Run regression check
        # latency threshold is generous (cross-hardware), recall is the strict gate
        run: python scripts/check_regression.py --run-benchmark --baseline benchmarks/baseline.json --latency-threshold 100
        env:
          RTMDK_ADD_RATE_LIMIT: '100000'

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t rtmdk:test .

      - name: Start Docker Compose test stack
        run: docker-compose -f docker-compose.test.yml up -d

      - name: Wait for services
        run: sleep 15

      - name: Run load tests
        run: docker-compose -f docker-compose.test.yml exec -T test pytest tests/test_server_load.py -v

      - name: Tear down
        run: docker-compose -f docker-compose.test.yml down -v

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build
