[mypy]
# Target 3.12 even though runtime support starts at 3.10: numpy>=2.2 bundled
# stubs use PEP 695 'type' and fatally crash mypy when targeting <3.12.
# Real 3.10-incompatibilities are caught by CI tests on py3.10/3.11 anyway.
python_version = 3.12
ignore_missing_imports = True
# Skip third-party stubs (imports become Any) — the ratchet guards our
# code's internal consistency, not vendor types; also faster and stabler
follow_imports = skip
# The manager-delegation pattern (RTMDKField.__getattr__ routes to
# *_manager subsystems) makes attr-defined unsound here: 77% of all
# findings. Disable it; the remaining codes stay enabled and gated.
disable_error_code = attr-defined
implicit_optional = True
warn_unused_ignores = False
show_error_codes = True
exclude = (myenv|archive|dist|scripts)

# Gradually enable stricter checks
warn_redundant_casts = False
warn_unused_configs = False
check_untyped_defs = False

# Ignore heavy legacy modules for now (to be cleaned up incrementally)
[mypy-rtmdk.memory.field]
ignore_errors = True

[mypy-rtmdk.memory.core]
ignore_errors = True

[mypy-rtmdk.memory.serialization]
ignore_errors = True

[mypy-numpy.*]
follow_imports = skip
ignore_errors = True

[mypy-scipy.*]
follow_imports = skip
