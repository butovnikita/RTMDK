[mypy]
# Target 3.12 even though runtime support starts at 3.10: numpy>=2.2 bundled
# stubs use PEP 695 'type' and fatally crash mypy when targeting <3.12.
# Real 3.10-incompatibilities are caught by CI tests on py3.10/3.11 anyway.
python_version = 3.12
ignore_missing_imports = True
# Skip third-party stubs (imports become Any) — the ratchet guards our
# code's internal consistency, not vendor types; also faster and stabler
follow_imports = skip
# R2.2 (2026-08-24, audit/risks-2026-08-24): attr-defined handling.
# The manager-delegation pattern (RTMDKField/RTMDKMemory.__getattr__ routes
# to *_manager subsystems: field -> manager -> field cycle, see
# rtmdk/memory/core.py:1295 __getattr__ and rtmdk/memory/field_initializer.py:19)
# makes attr-defined unsound: 77% of findings are false positives from
# delegated attributes (field.query -> query_manager.query, etc.).
# Alternative would be per-file disable + explicit type:ignore per line:
#   [mypy-rtmdk.memory.field] disable_error_code = attr-defined
#   [mypy-rtmdk.memory.core]  disable_error_code = attr-defined
# We keep it global for stability (203 files, ratchet baseline 0,
# scripts/check_mypy.py), but document here: all other error codes remain
# enabled and gated by .github/mypy-baseline.txt. If you add a new
# delegation, add type: ignore[attr-defined] locally, not a new global.
disable_error_code = attr-defined
implicit_optional = True
warn_unused_ignores = False
show_error_codes = True
exclude = (myenv|archive|dist|scripts)

# Gradually enable stricter checks
warn_redundant_casts = False
warn_unused_configs = False
check_untyped_defs = False

# R2.1 fix (2026-08-24, audit/risks-2026-08-24): heavy-module ignore removed.
# In 8.3.4 (CHANGELOG) debt 1088 -> 0 across all 203 files was eliminated
# (~160 fixes, baseline .github/mypy-baseline.txt:0). Keeping ignore_errors
# here would make that 0 a false-feeling ratchet (40% LOC hidden, R2.1).
# field/core/serialization are now fully checked for all codes except
# attr-defined (see below). If you must re-ignore a heavy module, add a
# per-file baseline instead of ignore_errors, so CI stays honest.

[mypy-numpy.*]
follow_imports = skip
ignore_errors = True

[mypy-scipy.*]
follow_imports = skip
