# Prometheus Alertmanager configuration for RTMDK Pipeline

global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@rtmdk.local'

route:
  receiver: 'default'
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: 'default'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#rtmdk-alerts'
        title: 'RTMDK Pipeline Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
